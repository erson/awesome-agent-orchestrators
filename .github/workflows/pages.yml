name: Publish catalog
on:
  push:
    branches: [main]
    paths: [catalog.html, .github/workflows/pages.yml]
  # Index refreshes push with the workflow token and skip push-triggered CI.
  workflow_run:
    workflows: ["Update index"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}
concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare the static catalog
        run: install -D -m 644 catalog.html public/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
