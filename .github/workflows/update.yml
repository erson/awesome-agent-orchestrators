name: Update index

# Guardrails against runaway runs:
# - No push or pull_request trigger, and the bot's commits carry [skip ci], so a run never starts another run.
# - One run at a time (concurrency); a queued duplicate replaces the older queued one.
# - The script stops starting work after --max-minutes, and timeout-minutes kills the job as a backstop.
#   Projects not reached are fetched on the next day's run.
# - The script exits after 3 batches in a row fail completely (bad token, GitHub outage).
# - Set the repository variable INDEX_UPDATES_DISABLED to "true" to switch the workflow off.
# At most 36 scheduled runs in a month (31 daily + 5 weekly). The script budgets are 25 min for metrics
# and 8 min for discovery. Standard GitHub-hosted runners are free while the repository is public.
#
# Security:
# - Actions are pinned to a commit SHA, so a moved tag cannot change what runs here.
# - The checkout leaves no token in .git/config; each step gets only the token it needs.
# - Only issues opened by this workflow are rewritten or closed, so a label put on someone else's issue
#   cannot make the bot overwrite it.
# - Text from other repositories (descriptions, release tags, names) is escaped before it is posted.
# - The script uses the Python that ships with the runner (standard library only), so no setup action is needed.

on:
  schedule:
    - cron: "23 4 * * *"   # metrics, every day (--spread: about a seventh of the projects per run)
    - cron: "47 5 * * 1"   # discovery of new projects, every Monday
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [metrics, discover, both]
        default: metrics

permissions: {}

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    if: vars.INDEX_UPDATES_DISABLED != 'true'
    runs-on: ubuntu-latest
    # Backstop only: the script's own budget (--max-minutes) ends the work well before this.
    timeout-minutes: 40
    permissions:
      contents: write   # commit the refreshed data
      issues: write     # rewrite the candidates issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose tasks
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "47 5 * * 1" ]; then TASK=discover; else TASK=metrics; fi
          fi
          [ "$TASK" != "discover" ] && echo "metrics=true" >> "$GITHUB_OUTPUT"
          [ "$TASK" != "metrics" ] && echo "discover=true" >> "$GITHUB_OUTPUT"
          echo "running: $TASK"

      - name: Sample issue responsiveness
        if: steps.plan.outputs.metrics == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_sample.py

      # Optional: a fine-grained personal access token with no permissions (public read only) in the
      # INDEX_TOKEN secret raises the API limits from 1,000 to 5,000 per hour. Without it the workflow's
      # own token is used. Only the two fetch steps see it.
      - name: Refresh metrics and README
        if: steps.plan.outputs.metrics == 'true'
        env:
          GH_TOKEN: ${{ secrets.INDEX_TOKEN || github.token }}
        run: python3 scripts/update.py --spread --max-minutes 23 --maintenance "$RUNNER_TEMP/maintenance.md"

      # Renamed, removed, or failing projects: shown in the job summary and kept in one open issue, which is
      # closed again once data/projects.json is fixed.
      - name: Update the maintenance issue
        if: ${{ !cancelled() && steps.plan.outputs.metrics == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/maintenance.md
        run: |
          # No file: the script stopped before it got this far (the fetch step shows why).
          [ -f "$REPORT" ] || exit 0
          number=$(gh issue list --label maintenance --state open --json number,author --jq '[.[] | select(.author.is_bot and .author.login == "app/github-actions")][0].number // empty')
          if [ -s "$REPORT" ]; then
            { echo "## Needs attention"; echo; cat "$REPORT"; } >> "$GITHUB_STEP_SUMMARY"
            gh label create maintenance --color D93F0B --description "Projects that need a manual fix" --force
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$REPORT"
            else
              gh issue create --title "Projects that need a manual fix" --label maintenance --body-file "$REPORT"
            fi
          else
            echo "Nothing needs attention." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Nothing needs attention any more."
            fi
          fi

      - name: Search for new projects
        if: steps.plan.outputs.discover == 'true'
        env:
          GH_TOKEN: ${{ secrets.INDEX_TOKEN || github.token }}
        run: python3 scripts/update.py --discover --max-minutes 8 --report "$RUNNER_TEMP/candidates.md"

      - name: Update the review issue
        if: ${{ !cancelled() && steps.plan.outputs.discover == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/candidates.md" ] || exit 0
          gh label create candidates --color 0E8A16 --description "New projects found by discovery" --force
          number=$(gh issue list --label candidates --state open --json number,author --jq '[.[] | select(.author.is_bot and .author.login == "app/github-actions")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/candidates.md"
          else
            gh issue create --title "Candidates for the index" --label candidates --body-file "$RUNNER_TEMP/candidates.md"
          fi
          { echo "## Discovery"; echo; cat "$RUNNER_TEMP/candidates.md"; } >> "$GITHUB_STEP_SUMMARY"

      # Runs after a failed fetch step too: the script saves what it fetched before it stops, and the
      # files are written atomically, so partial progress is safe to commit.
      - name: Commit changes
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A discovery-only run can follow an edit to the index before the next metrics run.
          # Render that edit from the existing cache using the same offline code path.
          if [ "${{ steps.plan.outputs.metrics }}" != true ]; then
            python3 scripts/update.py --render-only
          fi
          python3 scripts/update.py --check-generated
          git add README.md catalog.html data/metrics.json data/candidates.json data/projects.csv data/weekly-history.json
          if [ -f data/issue-samples.json ]; then git add data/issue-samples.json; fi
          if [ -f data/discovery-state.json ]; then git add data/discovery-state.json; fi
          if [ -f data/discovery-stats.json ]; then git add data/discovery-stats.json; fi
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh index data ($(date -u +%F)) [skip ci]"
          before=$(git rev-parse HEAD)
          git pull --rebase
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            python3 scripts/update.py --check-generated
          fi
          git push

  readme-editor:
    needs: update
    if: github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1' && github.run_attempt == '1'
    environment: Orchestrate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select weekly findings
        env:
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          MODEL_DEEPSEEK: ${{ vars.MODEL_DEEPSEEK }}
          MODEL_HY4: ${{ vars.MODEL_HY4 }}
        run: python3 scripts/readme_editor.py

      - name: Publish the validated brief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/readme-editor.json)" ]; then exit 0; fi
          python3 scripts/update.py --render-only
          python3 scripts/update.py --check-generated
          git add README.md data/readme-editor.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish weekly README brief [skip ci]"
          gh auth setup-git
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
